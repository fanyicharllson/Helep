# ─────────────────────────────────────────────────────────────────────────────
# HELEP Umbrella Chart — values.yaml
# ─────────────────────────────────────────────────────────────────────────────

# Shared Kafka bootstrap — Strimzi-managed in K8s (Part D)
kafkaBootstrap: "helep-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"

# Ingress host (add to /etc/hosts for Minikube: <minikube-ip> helep.local)
ingressHost: "helep.local"

# Responder matching strategy: nearest | random | zone_priority
matcherStrategy: "nearest"

# ── user-service ──────────────────────────────────────────────────────────────
user-service:
  image:
    repository: "charllson717/helep-user-service"
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  servicePort: 8001
  env:
    SERVICE_PORT: "8001"
    DB_PATH: "/data/user.db"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

