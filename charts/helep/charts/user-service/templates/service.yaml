apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: user-service
    app.kubernetes.io/part-of: helep
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8001"
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
