apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: analytics-service
    app.kubernetes.io/part-of: helep
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        app.kubernetes.io/part-of: helep
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8005"
    spec:
      # Run as non-root (UID 10001 — matches Dockerfile)
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: analytics-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8005
              protocol: TCP
          env:
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-analytics-service-config
                  key: KAFKA_BOOTSTRAP
            - name: MATCHER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-analytics-service-config
                  key: MATCHER
            - name: SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-analytics-service-config
                  key: SERVICE_PORT
            - name: DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-analytics-service-config
                  key: DB_PATH
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-analytics-service-secret
                  key: JWT_SECRET
          # liveness — is the app alive?
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # readiness — is Kafka reachable?
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: analytics-service-data
