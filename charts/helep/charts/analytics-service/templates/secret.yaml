apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-analytics-service-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: analytics-service
    app.kubernetes.io/part-of: helep
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwtSecret | default .Values.global.jwtSecret | default "change-me-in-production" | quote }}
