apiVersion: v1
kind: Service
metadata:
  name: dispatch-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: dispatch-service
    app.kubernetes.io/part-of: helep
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8003"
spec:
  type: ClusterIP
  selector:
    app: dispatch-service
  ports:
    - name: http
      port: 8003
      targetPort: 8003
      protocol: TCP
