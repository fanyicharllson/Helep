image:
  repository: "charllson717/helep-notification-service"
  tag: "0.1.0"
  pullPolicy: IfNotPresent
replicaCount: 1
servicePort: 8004
kafkaBootstrap: "helep-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
matcherStrategy: "nearest"
jwtSecret: "change-me-in-production"
env:
  SERVICE_PORT: "8004"
  DB_PATH: "/data/notification.db"
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
