apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: notification-service
    app.kubernetes.io/part-of: helep
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8004"
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8004
      targetPort: 8004
      protocol: TCP
