apiVersion: v1
kind: Service
metadata:
  name: sos-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: sos-service
    app.kubernetes.io/part-of: helep
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8002"
spec:
  type: ClusterIP
  selector:
    app: sos-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
